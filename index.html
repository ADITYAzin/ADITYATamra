<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADITYATamra</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />
    <link rel="stylesheet" href="style.css">
    <style>
        
        html, body {
        max-width: 100%;
        overflow-x: hidden;
        position: relative;
    }

    body.modal-open {
        padding-right: var(--scrollbar-width, 0px);
        overflow: hidden;
    }

    /* Mencegah pergeseran pada Navbar */
    body.modal-open nav {
        padding-right: var(--scrollbar-width, 0px) !important;
    }

    /* Memastikan blob-bg tidak mempengaruhi lebar dokumen */
    .blob-bg {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        pointer-events: none;
        z-index: -1;
    }
    
    /* Memperhalus transisi navbar saat scroll di mobile */
    #navbar {
        width: 100%;
        left: 0;
        right: 0;
    }
</style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#2563eb',
                        primaryDark: '#1d4ed8',
                        secondary: '#EFF6FF',
                        dark: '#0f172a'
                    },
                    boxShadow: {
                        'soft': '0 4px 20px -2px rgba(0, 0, 0, 0.03)',
                        'card': '0 10px 15px -3px rgba(0, 0, 0, 0.03), 0 4px 6px -2px rgba(0, 0, 0, 0.01)',
                        'card-hover': '0 20px 25px -5px rgba(37, 99, 235, 0.08), 0 10px 10px -5px rgba(37, 99, 235, 0.02)',
                        'glow': '0 0 25px rgba(37, 99, 235, 0.15)'
                    }
                }
            }
        }
    </script>
</head>
<body class="text-slate-900 selection:bg-blue-100 selection:text-blue-900 flex flex-col min-h-screen relative">

    <div class="blob-bg">
        <div class="blob bg-blue-100 w-[500px] h-[500px] top-0 left-0 -translate-x-1/2 -translate-y-1/2"></div>
        <div class="blob bg-indigo-50 w-[500px] h-[500px] bottom-0 right-0 translate-x-1/3 translate-y-1/3"></div>
    </div>

    <div id="lightbox" class="fixed inset-0 z-[100] bg-slate-900/95 backdrop-blur-sm flex items-center justify-center hidden p-4">
        <button onclick="closeLightbox()" class="absolute top-6 right-6 text-white/70 hover:text-white transition-colors bg-white/10 rounded-full p-2 hover:bg-white/20 z-50">
            <i data-lucide="x" class="w-8 h-8"></i>
        </button>
        <button onclick="changeSlide(-1)" class="absolute left-4 md:left-8 text-white/70 hover:text-white transition-all bg-white/10 hover:bg-white/20 rounded-full p-3 z-50 hover:scale-110">
            <i data-lucide="chevron-left" class="w-8 h-8"></i>
        </button>
        <button onclick="changeSlide(1)" class="absolute right-4 md:right-8 text-white/70 hover:text-white transition-all bg-white/10 hover:bg-white/20 rounded-full p-3 z-50 hover:scale-110">
            <i data-lucide="chevron-right" class="w-8 h-8"></i>
        </button>
        
        <div class="relative w-full max-w-5xl h-full flex flex-col items-center justify-center">
            <img id="lightbox-img" src="" class="max-h-[85vh] max-w-full object-contain rounded-lg shadow-2xl" alt="Gallery">
            <div class="mt-4 text-white/80 font-medium text-sm tracking-wide bg-black/30 px-4 py-2 rounded-full backdrop-blur-md" id="lightbox-counter"></div>
        </div>
    </div>

    <nav class="fixed w-full top-0 z-50 bg-white/80 backdrop-blur-lg transition-all duration-300 border-b border-slate-100" id="navbar">
    <div class="max-w-6xl mx-auto px-6 h-20 flex items-center justify-between">
        <div onclick="navigate('home')" class="cursor-pointer flex items-center gap-2 group">
            <div class="w-10 h-10 rounded-full bg-gradient-to-br from-primary to-blue-400 flex items-center justify-center text-white font-bold text-xl shadow-glow group-hover:scale-105 transition-transform duration-300 overflow-hidden">
                <img src="img/profile.jpeg" class="w-full h-full object-cover" alt="Profile">
            </div>
            <span class="font-bold text-xl tracking-tight text-slate-900">ADITYA<span class="text-primary">Tamra</span></span>
        </div>

        <div class="hidden lg:flex items-center gap-8">
            <div id="desktop-menu" class="flex gap-8"></div>
            <div class="h-6 w-px bg-slate-200"></div>
            
            <button onclick="toggleLanguage()" class="flex items-center gap-2 text-sm font-bold text-slate-600 hover:text-primary transition-colors bg-white px-3 py-1.5 rounded-lg border border-slate-100 hover:border-primary/20 shadow-soft">
                <i data-lucide="globe" class="w-4 h-4"></i><span id="current-lang">ID</span>
            </button>

            <a href="CV - ADITYA PRATAMA PUTRA.pdf" download="ADITYAPratamaPutra_CV.pdf" class="bg-slate-900 text-white px-6 py-2.5 rounded-full font-bold text-sm hover:bg-slate-800 hover:shadow-lg hover:-translate-y-0.5 transition-all flex items-center gap-2 active:scale-95 shadow-soft">
                <span id="nav-cv">CV</span> <i data-lucide="arrow-down-to-line" class="w-4 h-4"></i>
            </a>
        </div>

        <button class="lg:hidden p-2 rounded-lg bg-white border border-slate-100 text-slate-700 hover:bg-slate-100 hover:text-primary transition-colors shadow-soft" onclick="toggleMobileMenu()">
            <i data-lucide="menu" class="w-6 h-6"></i>
        </button>
    </div>

    <div id="mobile-menu" class="hidden lg:hidden bg-white border-b border-slate-100 absolute w-full shadow-xl">
        <div class="p-6 flex flex-col gap-4" id="mobile-menu-items"></div>
        
        <div class="px-6 pb-8 flex flex-col gap-3">
            <div class="h-px w-full bg-slate-100 mb-2"></div>
            
            <button onclick="toggleLanguage()" class="flex items-center gap-3 font-bold text-slate-600 bg-slate-50 px-4 py-3 rounded-xl w-full justify-center border border-slate-100">
                <i data-lucide="globe" class="w-5 h-5"></i> 
                <span id="mobile-lang-label">Ganti Bahasa</span>
            </button>

            <a href="CV - ADITYA PRATAMA PUTRA.pdf" download="ADITYAPratamaPutra_CV.pdf" class="bg-slate-900 text-white px-4 py-3 rounded-xl font-bold text-center flex items-center justify-center gap-3 shadow-lg active:scale-95 transition-transform">
                <span id="nav-cv">CV</span> 
                <i data-lucide="arrow-down-to-line" class="w-5 h-5"></i>
            </a>
        </div>
    </div>
</nav>

    <main id="app" class="flex-grow pt-20"></main>

    <footer class="bg-white border-t border-slate-100 pt-16 pb-8 relative overflow-hidden">
        <div class="max-w-6xl mx-auto px-6 flex flex-col md:flex-row justify-between items-center gap-8 relative z-10">
            <div class="text-center md:text-left">
                <div class="font-bold text-slate-900 text-2xl mb-2 flex items-center gap-2 justify-center md:justify-start">
                    <span class="font-bold text-2xl tracking-tight text-slate-900">ADITYA<span class="text-primary">Tamra</span></span>
                </div>
                
            </div>
            <div class="flex flex-wrap justify-center gap-8 text-sm font-bold text-slate-600" id="footer-links"></div>
            <div class="flex gap-4">
               <a href="mailto:adityapratamaputra.id@gmail.com" class="w-10 h-10 rounded-full bg-slate-50 border border-slate-100 flex items-center justify-center text-slate-600 hover:bg-primary hover:text-white hover:border-primary transition-all hover:-translate-y-1"><i data-lucide="mail" class="w-5 h-5"></i></a>
               <a href="https://www.linkedin.com/in/adityapratamaputraid/" target="_blank" rel="noopener noreferrer" class="w-10 h-10 rounded-full bg-slate-50 border border-slate-100 flex items-center justify-center text-slate-600 hover:bg-[#0077b5] hover:text-white hover:border-[#0077b5] transition-all hover:-translate-y-1"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5">
                    <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"></path>
                    <rect x="2" y="9" width="4" height="12"></rect>
                    <circle cx="4" cy="4" r="2"></circle>
                </svg></a>
               
            </div>
        </div>
        <div class="text-center text-xs text-slate-400 mt-12 pt-8 border-t border-slate-50">
            &copy; <span id="year"></span> ADITYA Pratama Putra. Crafted with focus & passion.
        </div>
    </footer>
    
    <script src="javascript/data.js"></script>
    <script src="/javascript/script.js"></script>
    <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
    <script>
        // Initialize Lucide Icons
        lucide.createIcons();
        // Set dynamic year
        document.getElementById('year').textContent = new Date().getFullYear();
    </script>
</body>
</html>
